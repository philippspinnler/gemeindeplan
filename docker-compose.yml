services:
  app:
    image: philippspinnler/gemeindeplan:latest
    build: .
    container_name: gemeindeplan
    ports:
      - '3000:3000'
    volumes:
      - ./data:/data
    environment:
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - DATABASE_PATH=/data/app.db
      - DATABASE_KEY=${DATABASE_KEY:-}
      - BODY_SIZE_LIMIT=1048576
      - TZ=Europe/Zurich
    restart: unless-stopped
